<div class="auth-container">
  <div class="auth-card glass-panel">
    <div class="auth-header">
      <div class="logo">
        <img src="assets/logo.jpeg" alt="HerCycle Logo" class="logo-img" />
        <h1>HerCycle</h1>
      </div>
      <p class="subtitle">Reset Password</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger">
        <span class="material-icons">error_outline</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success">
        <span class="material-icons">check_circle_outline</span>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <form (submit)="onSubmit(); $event.preventDefault();" class="auth-form">
      <div class="input-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="material-icons input-icon">email</span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="jane@example.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            required
          />
        </div>
      </div>

      <div class="input-group">
        <label for="token">Reset Token</label>
        <div class="input-wrapper">
          <span class="material-icons input-icon">vpn_key</span>
          <input 
            type="text" 
            id="token" 
            name="token" 
            placeholder="Paste reset token here"
            [ngModel]="token()"
            (ngModelChange)="token.set($event)"
            required
          />
        </div>
      </div>

      <div class="input-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <span class="material-icons input-icon">lock</span>
          <input 
            type="password" 
            id="newPassword" 
            name="newPassword" 
            placeholder="Enter new password"
            [ngModel]="newPassword()"
            (ngModelChange)="newPassword.set($event)"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Resetting Password...</span>
        } @else {
          <span>Reset Password</span>
          <span class="material-icons">lock_open</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Back to <a routerLink="/login" class="signup-link">Sign In</a></p>
    </div>
  </div>
</div>
