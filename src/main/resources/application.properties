# Server Configuration
server.port=8080

# Database Configuration (AWS RDS MySQL)
spring.datasource.url=jdbc:mysql://hercycle.cczkqckgorra.us-east-1.rds.amazonaws.com:3306/hercycle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=hercycle123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
