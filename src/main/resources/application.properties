hercycle.jwt.expiration=86400000
# 7 Days in Milliseconds
hercycle.jwt.refreshExpiration=604800000

# OpenAPI Swagger Details
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
